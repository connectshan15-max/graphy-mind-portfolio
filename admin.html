
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Graphy Mind</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #F1EDFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-box {
      background: white;
      max-width: 420px;
      width: 90%;
      margin: 70px auto;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 15px 50px rgba(108,59,255,0.1);
    }

    .login-box h1 {
      color: #6C3BFF;
      margin-bottom: 10px;
    }

    .login-box p {
      color: #777;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 15px;
      border: none;
      background: #6C3BFF;
      color: white;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #5124d6;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">GRAPHY MIND.</div>
</header>

<div class="login-box">
  <h1>Admin Login</h1>
  <p>Sign in to manage your portfolio.</p>

  <form>
    <input type="email" placeholder="Admin email" required>
    <input type="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <p style="margin-top:20px;text-align:center;">
    Private access · Graphy Mind
  </p>
</div>

</body>
</html>
